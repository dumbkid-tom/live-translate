<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live Translate — Real-time Speech Translation</title>
  <meta name="description" content="Low-latency real-time speech and text translation powered by Google Gemini Live API.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#brand-grad)"/>
            <defs>
              <linearGradient id="brand-grad" x1="2" y1="2" x2="22" y2="21.02" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00F2FE"/>
                <stop offset="1" stop-color="#4FACFE"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1>Gemini Live Translate</h1>
          <span class="badge model-badge">Gemini Live API</span>
        </div>
      </div>
      
      <div id="status-indicator" class="status-badge status-idle">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-content">
      <!-- Control Panel -->
      <section class="panel control-panel">
        <div class="panel-header">
          <h2>Translation Settings</h2>
          <p class="subtitle">Configure target language and output mode</p>
        </div>

        <div class="settings-grid">
          <!-- Target Language -->
          <div class="control-group">
            <label for="target-language">Target Language</label>
            <div class="select-wrapper">
              <select id="target-language" class="custom-select">
                <option value="English" selected>🇬🇧 English</option>
                <option value="Chinese (Mandarin)">🇨🇳 Chinese (Mandarin)</option>
                <option value="Spanish">🇪🇸 Spanish</option>
                <option value="French">🇫🇷 French</option>
                <option value="German">🇩🇪 German</option>
                <option value="Japanese">🇯🇵 Japanese</option>
                <option value="Korean">🇰🇷 Korean</option>
                <option value="Italian">🇮🇹 Italian</option>
                <option value="Portuguese">🇵🇹 Portuguese</option>
                <option value="Hindi">🇮🇳 Hindi</option>
                <option value="Russian">🇷🇺 Russian</option>
                <option value="Arabic">🇸🇦 Arabic</option>
                <option value="Vietnamese">🇻🇳 Vietnamese</option>
                <option value="Dutch">🇳🇱 Dutch</option>
                <option value="Polish">🇵🇱 Polish</option>
              </select>
            </div>
          </div>

          <!-- Output Mode Selection -->
          <div class="control-group">
            <label>Output Mode</label>
            <div class="mode-toggle-group">
              <button type="button" id="mode-audio" class="mode-btn active" data-mode="audio">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
                <span>Live Audio + Text</span>
              </button>
              <button type="button" id="mode-text" class="mode-btn" data-mode="text">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="4 7 4 4 20 4 20 7"/>
                  <line x1="9" y1="20" x2="15" y2="20"/>
                  <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
                <span>Live Text Only</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Visualizer Area -->
        <div class="visualizer-container">
          <canvas id="audio-visualizer" width="600" height="90"></canvas>
          <div id="visualizer-overlay" class="visualizer-overlay">
            <span>Click Start to Begin Live Audio Streaming</span>
          </div>
        </div>

        <!-- Primary Action Button -->
        <div class="action-bar">
          <button id="toggle-btn" class="btn btn-primary start-btn">
            <span class="btn-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </span>
            <span id="btn-label">Start Translation</span>
          </button>
        </div>
      </section>

      <!-- Transcript & History Panel -->
      <section class="panel transcript-panel">
        <div class="panel-header transcript-header">
          <div>
            <h2>Live Transcript</h2>
            <p class="subtitle">Real-time stream of translated dialogue</p>
          </div>
          <div class="transcript-actions">
            <button id="clear-btn" class="btn btn-secondary btn-sm" title="Clear transcript">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Clear</span>
            </button>
            <button id="export-json-btn" class="btn btn-secondary btn-sm" title="Export as JSON">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Save (JSON)</span>
            </button>
            <button id="export-txt-btn" class="btn btn-secondary btn-sm" title="Export as Markdown">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
              <span>Save (.md)</span>
            </button>
          </div>
        </div>

        <div id="transcript-container" class="transcript-container">
          <div class="empty-state" id="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>No translation output yet.<br>Press <strong>Start Translation</strong> and speak into your microphone.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Client JavaScript Modules -->
  <script src="/static/js/audio-recorder.js"></script>
  <script src="/static/js/audio-player.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
