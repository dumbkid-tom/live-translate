apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-translate-deployment
  labels:
    app: live-translate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: live-translate
  template:
    metadata:
      labels:
        app: live-translate
    spec:
      containers:
      - name: live-translate
        image: live-translate:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: live-translate-secret
              key: GEMINI_API_KEY
              optional: true
        envFrom:
        - configMapRef:
            name: live-translate-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
