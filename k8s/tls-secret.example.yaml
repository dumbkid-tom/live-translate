# Example: Kubernetes Secret holding a TLS certificate for the ingress.
#
# Replace this with a real certificate. Two common options:
#
#   1. Self-signed (for testing only — never expose to the public):
#       kubectl apply -f - <<'EOF'
#       apiVersion: v1
#       kind: Secret
#       metadata:
#         name: live-translate-tls
#         labels:
#           app: live-translate
#       type: kubernetes.io/tls
#       data:
#         tls.crt: <base64-encoded cert>
#         tls.key: <base64-encoded private key>
#       EOF
#
#   2. Let's Encrypt via cert-manager (recommended for public sites):
#       kubectl apply -f https://github.com/jetstack/cert-manager/release-1.14/manifests/installed.yaml
#       # Then annotate the ingress:
#       kubectl annotate ingress live-translate-ingress cert-manager.io/cluster-issuer="letsencrypt-prod"
#
# NOTE: This example file contains no real secrets and is git-safe.
apiVersion: v1
kind: Secret
metadata:
  name: live-translate-tls
  labels:
    app: live-translate
type: kubernetes.io/tls
stringData:
  # Paste the PEM-encoded certificate here (kubectl create secret tls will
  # base64-encode it automatically).
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <paste-PEM-cert-here>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    <paste-PEM-private-key-here>
    -----END PRIVATE KEY-----
